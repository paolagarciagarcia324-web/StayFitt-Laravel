[package]
name = "paolagarciagarcia324/stayfit"
version = "0.1.11"
description = "StayFit / FigueFit — plataforma Laravel"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app/" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"
[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
